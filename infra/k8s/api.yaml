apiVersion: apps/v1
kind: Deployment
metadata:
  name: recursive-arc-api
  labels: { app: recursive-arc-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: recursive-arc-api }
  template:
    metadata:
      labels: { app: recursive-arc-api }
    spec:
      containers:
        - name: api
          image: recursive-arc-engine/api:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: arc-secrets, key: database_url } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: arc-secrets, key: redis_url } }
            - name: ARC_DEVICE
              value: cpu
            - name: MAX_RECURSION_STEPS
              value: "64"
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2", memory: "4Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: recursive-arc-api
spec:
  selector: { app: recursive-arc-api }
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
